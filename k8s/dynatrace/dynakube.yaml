# DynaKube for the lab AKS cluster. Rendered by scripts/lib-integrations.sh
# (dynatrace_install_operator); placeholders are replaced at deploy time.
#
# cloudNativeFullStack: the OneAgent DaemonSet monitors every node (host CPU and
# memory feed the "02 AKS node ... pressure" metric events through the host
# group), while application code modules are injected only into the sre-demo
# namespace so platform pods are left alone.
apiVersion: dynatrace.com/v1beta5
kind: DynaKube
metadata:
  name: sre-demo
  namespace: dynatrace
  annotations:
    feature.dynatrace.com/k8s-app-enabled: "true"
spec:
  apiUrl: __DT_API_URL__
  tokens: dynakube-sre-demo
  metadataEnrichment:
    enabled: true
  oneAgent:
    hostGroup: __DT_AKS_HOST_GROUP__
    cloudNativeFullStack:
      namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values:
              - sre-demo
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
  activeGate:
    capabilities:
      - routing
      - kubernetes-monitoring
    group: sre-demo-__LAB_SUFFIX__
    # The lab runs on a single small node; keep the ActiveGate lean so the
    # baseline never trips the node-pressure scenario by itself.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
